    SECS.forEach(function (s) { mk[s.id] = String(s.mk); tg[s.id] = String(s.tg); });
    return {
      tab: 'lib', d: snap('v2'), mk: mk, tg: tg, imp: false, toast: '', a: 'v1', b: 'v2',
      vers: [
        { id: 'v1', label: 'v1 初版', date: '依 v2 備註回推', snap: snap('v1') },
        { id: 'v2', label: 'v2 已送屋主', date: '2025/08/24', snap: snap('v2') }
      ]
    };
  }

  cost(l) {
    if (l.cost != null) return l.cost;
    if (this.state.imp && l.pend != null) return l.pend;
    return null;
  }
  cnt(l, x) { return x.st === 'bill' && (!l.grp || x.sel); }
  margin(l, x) {
    const c = this.cost(l), p = num(x.p);
    if (c == null || p <= 0) return null;
    return (p - c) / p * 100;
  }
  flag(l, x) {
    const c = this.cost(l);
    if (c == null) return 'miss';
    const p = num(x.p);
    if (p < c) return 'neg';
    if (this.margin(l, x) < num(this.state.tg[l.sec])) return 'low';
    return 'ok';
  }
  sugg(l) {
    const c = this.cost(l);
    if (c == null) return null;
    return Math.ceil(c * (1 + num(this.state.mk[l.sec]) / 100) / 10) * 10;
  }
  tot(s) {
    const t = { r: 0, ps: 0, cs: 0, rv: 0, miss: 0, missAmt: 0, neg: 0, low: 0 };
    L.forEach((l) => {
      const x = s[l.id];
      if (!this.cnt(l, x)) return;
      const a = num(x.q) * num(x.p);
      if (SEC[l.sec].grp === 'reno') t.r += a; else t.ps += a;
      const c = this.cost(l);
      if (c == null) { t.miss++; t.missAmt += a; return; }
      t.cs += c * num(x.q); t.rv += a;
      const f = this.flag(l, x);
      if (f === 'neg') t.neg++; else if (f === 'low') t.low++;
    });
    t.rm = Math.round(t.r * 0.1); t.pm = Math.round(t.ps * 0.1);
    t.rt = t.r + t.rm; t.pt = t.ps + t.pm; t.ct = t.rt + t.pt;
    t.tax = Math.round(t.ct * 0.05);
    return t;
  }
  snapOf(id) {
    if (id === 'draft') return this.state.d;
    const v = this.state.vers.find(function (o) { return o.id === id; });
    return v ? v.snap : this.state.d;
  }
  labelOf(id) {
    if (id === 'draft') return '目前草稿';
    const v = this.state.vers.find(function (o) { return o.id === id; });
    return v ? v.label : '';
  }
  dirty() {
    const last = this.state.vers[this.state.vers.length - 1];
    return norm(this.state.d) !== norm(last.snap);
  }

  setLine(id, k, v) {
    this.setState(function (s) {
      const d = Object.assign({}, s.d);
      d[id] = Object.assign({}, d[id]);
      d[id][k] = v;
      return { d: d };
    });
  }
  pick(l) {
    this.setState(function (s) {
      const d = Object.assign({}, s.d);
      L.filter(function (o) { return o.grp === l.grp; }).forEach(function (o) {
        d[o.id] = Object.assign({}, d[o.id], { sel: o.id === l.id });
      });
      return { d: d };
    });
  }
  fixSec(secId) {
    const d = Object.assign({}, this.state.d);
    L.forEach((l) => {
      if (l.sec !== secId) return;
      const x = d[l.id];
      const f = this.flag(l, x);
      if (this.cnt(l, x) && (f === 'neg' || f === 'low')) d[l.id] = Object.assign({}, x, { p: String(this.sugg(l)) });
    });
    this.setState({ d: d });
  }
  save() {
    const s = this.state;
    const last = s.vers[s.vers.length - 1];
    if (!this.dirty()) { this.setState({ toast: '草稿跟 ' + last.label + ' 一樣，沒有要另存的變更。' }); return; }
    const n = s.vers.length + 1;
    const v = { id: 'v' + n, label: 'v' + n, date: '剛剛', snap: JSON.parse(JSON.stringify(s.d)) };
    this.setState({ vers: s.vers.concat([v]), a: last.id, b: v.id, tab: 'cmp', toast: '已存成 v' + n + '，下面是跟 ' + last.label + ' 的差異。' });
  }

  renderVals() {
    const s = this.state;
    const dirty = this.dirty();
    const last = s.vers[s.vers.length - 1];
    const nextLabel = 'v' + (s.vers.length + 1);
    const go = (tab) => () => this.setState({ tab: tab });

    const tabs = [['lib', '價格庫'], ['edit', '報價單編輯'], ['cmp', '版本比較'], ['pdf', '屋主視角 PDF']].map(function (t) {
      return { label: t[1], go: go(t[0]), style: s.tab === t[0] ? TAB_ON : TAB_OFF };
    });

    // ---------- 價格庫 ----------
    const vendors = [
      { name: '油漆廠商', trade: '油漆', date: '2025/10/31', tax: '未稅（另加 5%）', n: 5, ok: true },
      { name: '木工班（蓋抓報價）', trade: '木作＋假設工程', date: '未註明', tax: '未註明，視為未稅', n: 17, ok: s.imp },
      { name: '木地板廠商', trade: '木地板', date: '2025/07/29', tax: '含稅 → ÷1.05', n: 2, ok: true },
      { name: '鋁門窗廠商（YKK）', trade: '氣密窗', date: '2025/10/21', tax: '含稅優惠價 → ÷1.05', n: 1, ok: true }
    ].map(function (v) {
      return Object.assign(v, {
        status: v.ok ? '已核對' : '待核對',
        chipStyle: CHIP + (v.ok ? 'background: #DDF0EE; color: #0A5050' : 'background: #FCEBD9; color: #8A3F06')
      });
    });

    const impRows = L.filter(function (l) { return l.pend != null; }).map(function (l) {
      return {
        raw: l.raw,
        target: SEC[l.sec].no + ' ' + SEC[l.sec].name + ' · ' + l.name,
        costTxt: fmt(l.pend) + ' / ' + l.unit,
        chk: l.chk || '對應正確',
        chkStyle: CHIP + (l.chk ? 'background: #FCEBD9; color: #8A3F06' : 'background: #EEF1F4; color: #3D4752')
      };
    });

    const cats = SECS.map((sec) => ({
      title: sec.no + ' ' + sec.name + '（預設加成 ' + s.mk[sec.id] + '%）',
      rows: L.filter(function (l) { return l.sec === sec.id; }).map((l) => {
        const c = this.cost(l);
        const sg = this.sugg(l);
        const pending = c == null && l.pend != null;
        return {
          name: l.name, unit: l.unit,
          ven: l.ven ? VEN[l.ven] : '—',
          raw: l.raw || '尚無廠商報價，要詢價',
          costTxt: c != null ? fmt(c) : (pending ? '待核對' : '缺成本'),
          costStyle: c != null ? '' : CHIP + (pending ? 'background: #FCEBD9; color: #8A3F06' : 'border: 1px dashed #5B6673; color: #3D4752'),
          last: fmt(l.p),
          sugg: sg != null ? fmt(sg) : '—'
        };
      })
    }));

    // ---------- 編輯 ----------
    const secs = SECS.map((sec) => {
      let sub = 0, rv = 0, cs = 0, fixN = 0;
      const lines = L.filter(function (l) { return l.sec === sec.id; }).map((l) => {
        const x = s.d[l.id];
        const counted = this.cnt(l, x);
        const c = this.cost(l);
        const f = this.flag(l, x);
        const m = this.margin(l, x);
        const sg = this.sugg(l);
        const amt = num(x.q) * num(x.p);
        if (counted) {
          sub += amt;
          if (c != null) { rv += amt; cs += c * num(x.q); }
          if (f === 'neg' || f === 'low') fixN++;
        }
        const pending = c == null && l.pend != null;
        let mTxt = '—', mStyle = 'font-size: 12px; color: #5B6673';
        if (f === 'neg') { mTxt = '低於成本 每' + l.unit + ' ' + signed(num(x.p) - c); mStyle = CHIP + 'background: #B42318; color: #FFFFFF; font-weight: 700'; }
        else if (f === 'low') { mTxt = '毛利低 ' + m.toFixed(0) + '%'; mStyle = CHIP + 'background: #FCEBD9; color: #8A3F06; font-weight: 700'; }
        else if (f === 'ok') { mTxt = '毛利 ' + m.toFixed(0) + '%'; mStyle = 'font-size: 12px; color: #0A5050; font-weight: 500'; }
        let pBorder = 'border: 1px solid #C9D0D7; background: #FFFFFF; color: #18212B';
        if (counted && f === 'neg') pBorder = 'border: 2px solid #B42318; background: #FDECEA; color: #8F1B12; font-weight: 700';
        else if (counted && f === 'low') pBorder = 'border: 2px solid #B45309; background: #FCEBD9; color: #8A3F06';
        let tr = ROW;
        if (!counted) tr += 'background: #F7F8FA; color: #5B6673';
        else if (f === 'neg') tr += 'background: #FFF6F5';
        return {
          name: l.name, unit: l.unit, note: l.note || '', hasNote: !!l.note,
          hasWarn: c != null && !!l.chk && l.chk.indexOf('不一致') >= 0, warn: l.chk || '',
          isGrp: !!l.grp, notGrp: !l.grp, grpLabel: l.grp ? GRP[l.grp] : '',
          sel: !!x.sel, notSel: !x.sel, isEst: x.st === 'est', st: x.st,
          q: x.q, p: x.p,
          qLabel: l.name + ' 數量', pLabel: l.name + ' 售價', stLabel: l.name + ' 計價方式',
          onQ: (e) => this.setLine(l.id, 'q', e.target.value),
          onP: (e) => this.setLine(l.id, 'p', e.target.value),
          onSt: (e) => this.setLine(l.id, 'st', e.target.value),
          pick: () => this.pick(l),
          costTxt: c != null ? fmt(c) : (pending ? '待核對' : '缺成本'),
          costStyle: c != null ? '' : CHIP + (pending ? 'background: #FCEBD9; color: #8A3F06' : 'border: 1px dashed #5B6673; color: #3D4752'),
          amtTxt: counted ? fmt(amt) : '不計價',
          mTxt: mTxt, mStyle: mStyle,
          pStyle: PIN + pBorder,
          trStyle: tr,
          canFix: counted && (f === 'neg' || f === 'low') && sg != null,
          suggTxt: sg != null ? fmt(sg) : '',
          fix: () => this.setLine(l.id, 'p', String(sg))
        };
      });
      const sm = rv > 0 ? ((rv - cs) / rv * 100).toFixed(0) + '%' : '—';
      return {
        no: sec.no, name: sec.name, grpLabel: sec.grp === 'reno' ? '裝修工程' : '代付款項',
        subTxt: fmt(sub), marginTxt: '有成本品項毛利 ' + sm,
        mk: s.mk[sec.id], tg: s.tg[sec.id],
        onMk: (e) => { const mk = Object.assign({}, this.state.mk); mk[sec.id] = e.target.value; this.setState({ mk: mk }); },
        onTg: (e) => { const tg = Object.assign({}, this.state.tg); tg[sec.id] = e.target.value; this.setState({ tg: tg }); },
        hasFix: fixN > 0, fixTxt: fixN + ' 項紅／橘一鍵套建議價',
        fixAll: () => this.fixSec(sec.id),
        lines: lines
      };
    });

    const t = this.tot(s.d);
    const sum = {
      r: fmt(t.r), rm: fmt(t.rm), rt: fmt(t.rt), ps: fmt(t.ps), pm: fmt(t.pm), pt: fmt(t.pt),
      ct: fmt(t.ct), tax: fmt(t.tax), ctx: fmt(t.ct + t.tax),
      rv: fmt(t.rv), cs: fmt(t.cs),
      gp: fmt(t.rv - t.cs) + (t.rv > 0 ? '（' + ((t.rv - t.cs) / t.rv * 100).toFixed(1) + '%）' : ''),
      mg: fmt(t.rm + t.pm),
      neg: t.neg, low: t.low, miss: t.miss, missAmt: fmt(t.missAmt)
    };

    const pays = [
      { n: '第一期', pct: 35, when: '工程進場前（訂金）', link: '簽約即請款' },
      { n: '第二期', pct: 30, when: '泥作工程完成或木工進場', link: '綁進度表：泥作工程「完成」／木作工程「開始」' },
      { n: '第三期', pct: 30, when: '木作工程完工或油漆進場', link: '綁進度表：木作工程「完成」／油漆工程「開始」' },
      { n: '第四期', pct: 5, when: '完工', link: '綁進度表：交屋' }
    ];
    let paid = 0;
    pays.forEach(function (p, i) {
      const a = i === pays.length - 1 ? t.ct - paid : Math.round(t.ct * p.pct / 100);
      paid += a;
      p.amt = fmt(a);
    });

    // ---------- 版本比較 ----------
    const ids = s.vers.map(function (v) { return v.id; }).concat(dirty ? ['draft'] : []);
    const pill = (on) => on
      ? 'height: 40px; padding: 0 14px; border: none; border-radius: 10px; background: #0F6E6E; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer'
      : 'height: 40px; padding: 0 14px; border: 1px solid #C9D0D7; border-radius: 10px; background: #FFFFFF; color: #18212B; font-size: 13px; cursor: pointer';
    const optsA = ids.map((id) => ({ label: id === 'draft' ? nextLabel + ' 草稿' : this.labelOf(id), style: pill(s.a === id), go: () => this.setState({ a: id }) }));
    const optsB = ids.map((id) => ({ label: id === 'draft' ? nextLabel + ' 草稿' : this.labelOf(id), style: pill(s.b === id), go: () => this.setState({ b: id }) }));
    const A = this.snapOf(s.a), B = this.snapOf(s.b);
    const tA = this.tot(A), tB = this.tot(B);
    const rows = [];
    L.forEach((l) => {
      const xa = A[l.id], xb = B[l.id];
      const ca = this.cnt(l, xa), cb = this.cnt(l, xb);
      const aa = ca ? num(xa.q) * num(xa.p) : 0, ab = cb ? num(xb.q) * num(xb.p) : 0;
      let kind = '', before = '', after = '';
      if (ca && !cb) {
        kind = l.grp ? '改選其他方案' : (xb.st === 'buy' ? '改為建議購買成品' : (xb.st === 'est' ? '改為預估未計價' : '取消'));
        before = fmt(aa); after = '不計價';
      } else if (!ca && cb) {
        kind = l.grp ? '改選這個方案' : '改為計價';
        before = '不計價'; after = fmt(ab);
      } else if (ca && cb) {
        const parts = [];
        if (num(xa.q) !== num(xb.q)) parts.push('數量 ' + num(xa.q) + ' → ' + num(xb.q));
        if (num(xa.p) !== num(xb.p)) parts.push('單價 ' + fmt(num(xa.p)) + ' → ' + fmt(num(xb.p)));
        if (!parts.length) return;
        kind = parts.join('・'); before = fmt(aa); after = fmt(ab);
      } else return;
      const dlt = ab - aa;
      rows.push({
        sec: SEC[l.sec].no + ' ' + SEC[l.sec].name, name: l.name, kind: kind, before: before, after: after,
        delta: signed(dlt),
        dStyle: 'font-weight: 700; color: ' + (dlt > 0 ? '#0A5050' : (dlt < 0 ? '#8F1B12' : '#3D4752'))
      });
    });
    const dTot = tB.ct - tA.ct;
    const cmp = {
      aLabel: s.a === 'draft' ? nextLabel + ' 草稿' : this.labelOf(s.a),
      bLabel: s.b === 'draft' ? nextLabel + ' 草稿' : this.labelOf(s.b),
      aTot: fmt(tA.ct), bTot: fmt(tB.ct), delta: signed(dTot), n: rows.length,
      deltaStyle: 'font-size: 22px; font-weight: 700; margin-top: 4px; color: ' + (dTot > 0 ? '#0A5050' : (dTot < 0 ? '#8F1B12' : '#18212B')),
      rows: rows, has: rows.length > 0, none: rows.length === 0
    };
    const verList = s.vers.map((v) => ({ label: v.label, date: v.date, tot: '合約總額 ' + fmt(this.tot(v.snap).ct) }));

    // ---------- 屋主 PDF ----------
    const remark = (l, x) => {
      const bits = [];
      if (l.note) bits.push(l.note);
      if (l.grp) bits.push(x.sel ? '二選一・已選' : '二選一・未選');
      if (x.st === 'buy') bits.push('建議購買成品・未計價');
      if (x.st === 'est') bits.push('預估費用・未計價');
      return bits.join('　');
    };
    const pdfSum = SECS.filter(function (sec) { return sec.grp === 'reno'; }).map((sec) => {
      let a = 0;
      L.forEach((l) => { if (l.sec === sec.id && this.cnt(l, s.d[l.id])) a += num(s.d[l.id].q) * num(s.d[l.id].p); });
      return { no: sec.no, name: sec.name, amt: fmt(a) };
    });
    const pdfPass = L.filter(function (l) { return l.sec === 'px'; }).map((l, i) => {
      const x = s.d[l.id];
      const counted = this.cnt(l, x);
      return { no: String(i + 1), name: l.name, remark: remark(l, x), uq: l.unit + ' ' + num(x.q), amt: counted ? fmt(num(x.q) * num(x.p)) : (x.st === 'est' ? fmt(num(x.q) * num(x.p)) + '（未計價）' : '—') };
    });
    const pdfDetail = SECS.filter(function (sec) { return sec.grp === 'reno'; }).map((sec) => {
      let sub = 0;
      const rs = L.filter(function (l) { return l.sec === sec.id; }).map((l, i) => {
        const x = s.d[l.id];
        const counted = this.cnt(l, x);
        const a = num(x.q) * num(x.p);
        if (counted) sub += a;
        return {
          i: String(i + 1), name: l.name, unit: l.unit, q: String(num(x.q)), p: fmt(num(x.p)),
          amt: counted ? fmt(a) : '—', remark: remark(l, x),
          style: PROW + (counted ? '' : 'color: #5B6673')
        };
      });
      return { title: sec.no + ' ' + sec.name, rows: rs, sub: fmt(sub) };
    });
    const pdf = {
      ver: dirty ? nextLabel + ' 草稿（尚未存版）' : last.label,
      date: dirty ? '[送出日期]' : last.date,
      sum: pdfSum, pass: pdfPass, detail: pdfDetail
    };

    return {
      tabs: tabs,
      isLib: s.tab === 'lib', isEdit: s.tab === 'edit', isCmp: s.tab === 'cmp', isPdf: s.tab === 'pdf',
      hasToast: !!s.toast, toast: s.toast, closeToast: () => this.setState({ toast: '' }),
      reset: () => this.setState(this.fresh()),
      verChip: dirty ? '編輯中：' + nextLabel + ' 草稿（以 ' + last.label + ' 為底）' : '目前版本：' + last.label,
      vendors: vendors, notImp: !s.imp, impRows: impRows, impCount: impRows.length,
      doImport: () => this.setState({ imp: true, tab: 'edit', toast: '木工班報價已存入價格庫（' + impRows.length + ' 項）。紅色是現在售價低於成本的品項。' }),
      cats: cats,
      secs: secs, sum: sum, pays: pays,
      saveTxt: dirty ? '存成新版本 ' + nextLabel : '沒有變更（' + last.label + '）',
      save: () => this.save(),
      goPdf: go('pdf'), goLib: go('lib'),
      optsA: optsA, optsB: optsB, cmp: cmp, verList: verList,
      pdf: pdf
    };
  }
}

    each(p.detail, function (d) {
      return '<div style="font-size:12px"><div class="ph2">' + esc(d.title) + '</div>' +
        '<div class="g-pdet" style="color:#5B6673;font-weight:500"><div class="pc">項次</div><div class="pc">品項</div><div class="pc">單位</div><div class="pc" style="text-align:right">數量</div><div class="pc" style="text-align:right">單價</div><div class="pc" style="text-align:right">金額</div><div class="pc">備註／品牌</div></div>' +
        each(d.rows, function (r) {
          return '<div style="' + esc(r.style) + '"><div class="pc">' + r.i + '</div><div class="pc">' + esc(r.name) + '</div><div class="pc">' + esc(r.unit) + '</div>' +
            '<div class="pc" style="text-align:right">' + esc(r.q) + '</div><div class="pc" style="text-align:right">' + esc(r.p) + '</div><div class="pc" style="text-align:right">' + esc(r.amt) + '</div>' +
            '<div class="pc" style="color:#3D4752">' + esc(r.remark) + '</div></div>';
        }) +
        '<div class="tot-r" style="font-weight:500"><span>小計</span><span style="width:80px">' + d.sub + '</span><span style="width:160px"></span></div></div>';
    }) +
    '<div><div class="ph2">付款方法</div>' + each(v.pays, function (x) {
      return '<div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #EEF1F4"><span>' + esc(x.n) + '：' + esc(x.when) + '，支付工程總金額 ' + x.pct + '%</span><span style="white-space:nowrap">' + x.amt + '</span></div>';
    }) + '<div style="font-size:12px;color:#3D4752;margin-top:6px">本報價單內容依設計圖面為準；未列之項目不含於工程總價中；材料如需變更需補差額。</div></div>' +
    '<div class="two" style="gap:24px;margin-top:12px"><div style="border-top:1px solid #18212B;padding-top:6px">合約工程承包商簽章　　日期：</div><div style="border-top:1px solid #18212B;padding-top:6px">客戶簽章　　日期：</div></div>' +
    '</div></div></div>';
}

let APP = null;
function render() {
  H = [];
  const v = APP.renderVals();
  let body = '';
  if (v.isLib) body = libHtml(v);
  else if (v.isEdit) body = editHtml(v);
  else if (v.isCmp) body = cmpHtml(v);
  else body = pdfHtml(v);
  document.getElementById('app').innerHTML = '<div class="wrap">' + topHtml(v) + body + '</div>';
}
function persist(s) { try { localStorage.setItem(STORE, JSON.stringify(Object.assign({}, s, { toast: '' }))); } catch (e) {} }

DCLogic.prototype.setState = function (u) {
  const prevTab = this.state.tab;
  const val = typeof u === 'function' ? u(this.state) : u;
  this.state = Object.assign({}, this.state, val);
  persist(this.state);
  render();
  if (this.state.tab !== prevTab) window.scrollTo(0, 0);
};

APP = new Component({});
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved && saved.d && saved.vers && Object.keys(saved.d).length === L.length) APP.state = Object.assign(APP.state, saved);
} catch (e) {}

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-click]');
  if (el && H[el.dataset.click]) H[el.dataset.click](e);
});
document.addEventListener('change', function (e) {
  const el = e.target.closest('[data-change]');
  if (el && H[el.dataset.change]) H[el.dataset.change]({ target: el });
});
render();

</script>
</body>
