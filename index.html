<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0F6E6E">
<title>工程日誌 · 試用原型</title>
<meta property="og:title" content="工程日誌 · 試用原型">
<meta property="og:description" content="設計師寫日誌、勾選要公開的內容，屋主在手機上看工程進度、確認待決事項。範例：示範案場">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#18212B;--ink2:#3D4752;--muted:#5B6673;
  --line:#E1E5EA;--line2:#EDF0F3;--bg:#F5F7F9;--page:#E8EBEE;
  --teal:#0F6E6E;--teal-d:#0A5050;--teal-l:#DDF0EE;--teal-xl:#E3EEF0;
  --amber:#B45309;--amber-d:#8A3F06;--amber-l:#FCEBD9;
  --red-d:#9B1C22;--red-l:#FBE3E4;
  --gray-l:#EEF1F4;--gray-b:#C9D0D7;--bar-todo:#A9B3BD;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:var(--page);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.root{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px;gap:20px}
.topbar{width:100%;max-width:876px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar h1{font-size:22px;margin:0}
.topbar p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.reset{height:44px;padding:0 18px;border:1px solid var(--gray-b);border-radius:12px;background:#fff;font-size:14px;flex-shrink:0}
.switch{display:none}
.stage{display:flex;gap:64px;justify-content:center}
.col{display:flex;flex-direction:column;gap:12px}
.col-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.col-label .sub{font-weight:400;color:var(--muted)}
.device{width:406px;height:min(860px,calc(100vh - 150px));min-height:660px;border:8px solid var(--ink);border-radius:44px;overflow:hidden;background:var(--bg);position:relative}

.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.appbar{padding:20px 20px 14px;background:#fff;border-bottom:1px solid var(--line)}
.appbar.client{background:var(--teal);color:#fff;border-bottom:none}
.eyebrow{font-size:12px;color:var(--muted)}
.client .eyebrow{color:#D5ECEA}
.appbar .title{font-size:19px;font-weight:700;margin-top:2px}
.navbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.navbar .grow{flex:1;min-width:0}
.navbar .title{font-size:16px;font-weight:700}
.icon-btn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroll>*{flex-shrink:0}
.footer{padding:12px 16px 16px;background:#fff;border-top:1px solid var(--line)}
.backlink{display:flex;align-items:center;gap:2px;height:44px;margin:-8px 0 -4px -10px;padding:0 10px;border:none;background:transparent;color:var(--teal-d);font-size:14px;font-weight:500;align-self:flex-start}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.card.hl{border:2px solid var(--teal)}
.card.warn{border:2px solid var(--amber)}
.stack{display:flex;flex-direction:column;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h{font-size:15px;font-weight:700}
.h.sm{font-size:14px}
.muted{color:var(--muted);font-size:12px}
.body{font-size:13px;color:var(--ink2);line-height:1.6}
.li{font-size:14px;line-height:1.6;padding:2px 0}
.row{padding:10px 0;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:500;flex-shrink:0;white-space:nowrap}
.chip.amber{background:var(--amber-l);color:var(--amber-d)}
.chip.teal{background:var(--teal-l);color:var(--teal-d)}
.chip.gray{background:var(--gray-l);color:var(--ink2)}
.chip.red{background:var(--red-l);color:var(--red-d)}
.chip.lg{height:28px;padding:0 10px;border-radius:14px;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:12px;font-size:15px;font-weight:500;border:1px solid transparent}
.btn.sm{height:44px;font-size:14px}
.btn.dark{background:var(--ink);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.line{background:#fff;border-color:var(--gray-b);color:var(--ink)}
.btn.line-teal{background:#fff;border-color:var(--teal);color:var(--teal-d)}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn{flex:1;width:auto;padding:0 8px}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar.lg{height:10px;border-radius:5px}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:inherit}
.tip{display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--teal-xl);font-size:12px;line-height:1.6}
.tip svg{flex-shrink:0;margin-top:2px}

.trade{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border:1px solid var(--gray-b);border-radius:22px;background:#fff;font-size:18px}
.stepper .n{min-width:40px;text-align:center}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.entry .t{flex:1;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.vis{display:flex;align-items:center;gap:4px;flex-shrink:0;height:40px;padding:0 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--gray-b);background:var(--gray-l);color:var(--ink2)}
.vis.on{background:var(--teal);border-color:var(--teal);color:#fff}
.input-row{display:flex;gap:8px;margin-top:10px}
.txt{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--gray-b);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.txt.full{width:100%;flex:none}
.sel{height:44px;width:100%;padding:0 10px;border:1px solid var(--gray-b);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.lbl{display:block;font-size:13px;font-weight:700;margin:2px 0 6px}
.add{height:44px;padding:0 14px;border:1px solid var(--ink);border-radius:10px;background:#fff;font-size:14px;font-weight:500;flex-shrink:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph-cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:104px;padding:22px 4px 6px;border-radius:10px;border:3px solid transparent;font-size:11px;color:var(--ink2);line-height:1.3;text-align:center}
.ph.on{border-color:var(--teal)}
.ph .badge{position:absolute;top:6px;left:6px;height:20px;line-height:20px;padding:0 6px;border-radius:10px;font-size:10px;background:rgba(255,255,255,.92);color:var(--ink2)}
.ph.on .badge{background:var(--teal);color:#fff}
.ph.sm{height:80px;padding:4px;border:none}
.ph.sm .badge{top:4px;left:4px}
.ph-trade{height:36px;width:100%;padding:0 4px;border:1px solid var(--gray-b);border-radius:8px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:14px;text-align:left}
.track{position:relative;flex-shrink:0;width:48px;height:28px;border-radius:14px;background:var(--gray-b);transition:background .15s}
.track i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
[aria-pressed="true"] .track{background:var(--teal)}
[aria-pressed="true"] .track i{left:23px}
textarea{width:100%;min-height:440px;padding:14px;border:1px solid var(--gray-b);border-radius:12px;font:inherit;font-size:16px;line-height:1.7;resize:vertical;color:var(--ink);background:#fff}
textarea.sm{min-height:120px;padding:12px}
.pre{white-space:pre-line;font-size:13px;line-height:1.7}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border:1px solid var(--gray-b);border-radius:12px;background:#fff;text-align:left;font-size:14px}
.opt[aria-pressed="true"]{border:2px solid var(--teal);background:var(--teal-xl)}
.radio{width:20px;height:20px;border-radius:10px;border:2px solid var(--gray-b);flex-shrink:0;background:#fff}
.opt[aria-pressed="true"] .radio{border:6px solid var(--teal)}
.quote{padding:12px;border-radius:12px;background:var(--gray-l);font-size:13px;line-height:1.6;color:var(--ink2)}

.album-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.album{display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;text-align:left}
.album .cover{display:flex;align-items:center;justify-content:center;width:100%;height:92px}
.album .meta{padding:10px 12px}
.album .name{font-size:15px;font-weight:700}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--gray-l)}
.seg button{height:36px;border:none;border-radius:9px;background:transparent;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(24,33,43,.15)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.mchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.mchip{flex-shrink:0;height:36px;padding:0 12px;border:1px solid var(--gray-b);border-radius:18px;background:#fff;font-size:13px}
.mchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.cal{border-collapse:collapse;font-size:10px}
.cal th,.cal td{border:1px solid var(--line2);height:26px;min-width:22px;padding:0;text-align:center;font-weight:500;color:var(--ink2)}
.cal th.nm{position:sticky;left:0;z-index:1;min-width:104px;max-width:104px;padding:3px 6px;background:#fff;text-align:left;font-size:11px;line-height:1.25;color:var(--ink);box-shadow:1px 0 0 var(--line)}
.cal .we{background:#D5DAE0}
.cal th.good{background:#D9A3A0;color:#3B1513}
.cal .today{box-shadow:inset 0 0 0 2px var(--amber)}
.date{flex:1;min-width:0;height:44px;padding:0 8px;border:1px solid var(--gray-b);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.mini{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.fld{flex:1;min-width:0}

.big{font-size:36px;font-weight:700;color:var(--teal)}
.dotrow{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.dot{width:8px;height:8px;border-radius:4px;margin-top:7px;flex-shrink:0}
.months{position:relative;height:16px}
.months span{position:absolute;top:0;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.tl{padding:10px 0;border-top:1px solid var(--line2)}
.tl .name{font-size:13px;font-weight:500;line-height:1.4}
.tl .range{font-size:11px;color:var(--muted);margin-top:2px}
.gantt{position:relative;height:6px;background:var(--line2);border-radius:3px;margin-top:7px}
.gantt .seg{position:absolute;top:0;bottom:0;border-radius:3px}
.gantt .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--amber)}

.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:6px 8px 10px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border:none;background:transparent;color:var(--muted);font-size:11px}
.tab[aria-current="page"]{color:var(--teal);font-weight:700}
.toast{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:none;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(24,33,43,.22);text-align:left}
.toast .ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#06C755;color:#fff;flex-shrink:0}
.toast .ic.in{background:var(--ink)}
.toast .tx{display:flex;flex-direction:column;gap:2px}
.fresh{animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-12px);opacity:0}}
.snack{display:none}

@media (max-width:919px){
  body{background:var(--bg)}
  .root{height:100vh;height:100dvh;min-height:0;padding:0;gap:0;align-items:stretch}
  .topbar{max-width:none;padding:10px 16px;background:#fff}
  .topbar h1{font-size:16px}
  .topbar p{font-size:12px;margin-top:2px}
  .reset{height:40px;padding:0 12px;font-size:13px}
  .switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 16px 10px;background:#fff;border-bottom:1px solid var(--line)}
  .sw{position:relative;height:40px;border-radius:10px;border:1px solid var(--gray-b);background:#fff;font-size:14px;font-weight:500}
  .sw[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .sw .new{position:absolute;top:-6px;right:-4px;height:18px;line-height:18px;padding:0 6px;border-radius:9px;background:#D13A3F;color:#fff;font-size:10px;font-weight:700}
  .stage{flex:1;min-height:0;display:block}
  .col{height:100%;gap:0}
  .col-label{display:none}
  .device{width:100%;height:100%;min-height:0;border:none;border-radius:0}
  .stage[data-view="designer"] .col-client,.stage[data-view="client"] .col-designer{display:none}
  .footer,.tabbar{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .snack.show{display:flex;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(24,33,43,.3)}
  .snack .grow{flex:1}
  .snack button{height:40px;padding:0 14px;border:none;border-radius:10px;background:#fff;color:var(--ink);font-size:14px;font-weight:700;flex-shrink:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="root"></div>
<noscript>這個原型需要開啟 JavaScript 才能使用。</noscript>
<script>
(function () {
  'use strict';

  // ---------- 示範資料（虛構案場，僅供試用） ----------
  var DAY = 86400000;
  var WK = '日一二三四五六';
  function D(mmdd) { var p = mmdd.split('/'); var m = +p[0]; return Date.UTC(m >= 8 ? 2025 : 2026, m - 1, +p[1]); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function wk(t) { return '（' + WK[new Date(t).getUTCDay()] + '）'; }
  function md(t) { var x = new Date(t); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate() + wk(t); }
  function roc(t) { var x = new Date(t); return (x.getUTCFullYear() - 1911) + '/' + pad(x.getUTCMonth() + 1) + '/' + pad(x.getUTCDate()) + wk(t); }
  function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  var TODAY = D('10/30');
  var SPAN0 = D('08/18');
  var SPAN = D('02/16') + DAY - SPAN0;
  function posPct(t) { return ((t - SPAN0) / SPAN * 100).toFixed(2); }
  var TODAY_PCT = posPct(TODAY + DAY / 2);
  var PCT = Math.round((TODAY - D('08/20')) / (D('02/09') - D('08/20')) * 100);

  var SCHED = [
    ['保護工程＋臨時水電', '08/20', '08/22', 3],
    ['拆除工程＋垃圾清運', '08/25', '08/29', 5],
    ['放樣、臨時大門、全屋施工防水', '08/29', '09/02', 3],
    ['鋁門窗複量尺寸＋下定', '09/01', '10/30', 40],
    ['樓上排水管隔音包覆', '09/01', '09/02', 2],
    ['隔間放樣＋單面施作', '09/01', '09/05', 5],
    ['玻璃磚結構補強', '09/05', '09/05', 1],
    ['水電放樣＋配管', '09/08', '09/21', 10],
    ['冷氣配管＋洗孔', '09/15', '09/19', 5],
    ['陽台及廁所水泥整平＋隔熱塗料', '09/22', '10/04', 9],
    ['防水施作', '09/29', '10/12', 7],
    ['磁磚放樣及鋪貼', '10/13', '10/27', 10],
    ['磁磚保護', '10/27', '10/27', 1],
    ['訂製門及窗框安裝、泥作崁縫填實', '10/27', '10/31', 5],
    ['隔間雙面封板（隔音棉、隔熱棉）', '10/27', '11/02', 5],
    ['天花板角材施作', '11/03', '11/16', 10],
    ['燈具位置及冷氣檢修口放樣', '11/05', '11/05', 1],
    ['天花板封板', '11/17', '11/23', 5],
    ['立面門框及木皮板', '11/24', '12/07', 10],
    ['玻璃磚安裝', '12/08', '12/10', 3],
    ['木作櫃體施作', '12/07', '12/27', 14],
    ['石材及出風口金屬丈量', '12/29', '12/29', 1],
    ['油漆 AB 膠＋批土打磨打底', '12/22', '01/04', 8],
    ['油漆面漆噴漆', '01/05', '01/25', 15],
    ['全室除塵初步細清', '01/23', '01/23', 1],
    ['燈具及設備安裝', '01/26', '01/30', 5],
    ['冷氣測試', '01/26', '01/30', 5],
    ['石材安裝', '01/28', '01/30', 3],
    ['木地板安裝', '02/02', '02/04', 3],
    ['全室環境細清', '02/05', '02/06', 2],
    ['軟裝進場安裝', '02/09', '02/15', 5],
    ['完工拍攝日', '02/13', '02/13', 1]
  ];
  var ROWS = SCHED.map(function (r) {
    var a = D(r[1]), b = D(r[2]);
    var st = b < TODAY ? 'done' : (a <= TODAY ? 'doing' : 'todo');
    return {
      name: r[0], start: a, end: b, st: st,
      range: md(a) + (a === b ? '' : ' – ' + md(b)) + ' · ' + r[3] + ' 工作日',
      left: posPct(a), width: Math.max((b - a + DAY) / SPAN * 100, 1.5).toFixed(2)
    };
  });
  function rowByName(n) { for (var i = 0; i < ROWS.length; i++) if (ROWS[i].name === n) return ROWS[i]; return null; }
  var DOING = ROWS.filter(function (r) { return r.st === 'doing'; });
  var UPCOMING = ROWS.filter(function (r) { return r.start > TODAY; });
  var NEXT_WEEK = ROWS.filter(function (r) { return r.start >= D('11/03') && r.start <= D('11/09'); });
  var COUNT = { done: 0, doing: 0, todo: 0 };
  ROWS.forEach(function (r) { COUNT[r.st]++; });

            '</div>' +

              '<div class="fld"><label for="pt' + id + 'x" class="mini">狀態</label><select id="pt' + id + 'x" class="sel" data-plan="' + id + ':status">' + opts(PLAN_STATUS, r.status) + '</select></div>' +
              '<div class="fld"><label for="py' + id + '" class="mini">類型</label><select id="py' + id + '" class="sel" data-plan="' + id + ':type">' + opts(PLAN_TYPES, r.type) + '</select></div>' +
            '</div>' +
            (bad ? '<div class="muted" style="color:var(--amber-d);margin-top:8px">請填工種名稱，結束日不能早於開始日</div>' : '') +
          '</div>';
        }).join('') +
        '<button class="btn sm line" data-act="planAdd">＋ 新增一列</button>' +
      '</div>' +
      '<div class="footer">' + (invalid ? '<div class="muted" style="color:var(--amber-d);margin-bottom:8px;text-align:center">有欄位要修正才能更新</div>' : '') +
        '<button class="btn teal" data-act="planPub" aria-disabled="' + (invalid || !dirty) + '">' + (dirty ? '更新給屋主' : '屋主看到的已是最新版本') + '</button></div>' +
    '</div>';
  }

  // ---------- 屋主端 ----------
  function feed() {
    var list = PAST_LOGS.map(function (l) { return { date: roc(l.t), trades: l.trades, entries: l.entries, photos: l.photos, today: false }; });
    var s = S.snapshot;
    if (s && (s.entries.length || s.photos.length)) list.unshift({ date: roc(TODAY), trades: s.trades, entries: s.entries, photos: s.photos, today: true });
    return list;
  }

  function cHome() {
    var top = feed()[0];
    var more = top.entries.length > 2 ? '、還有 ' + (top.entries.length - 2) + ' 條內容' : '';
    var oc = openConfirms();
    var dc = doneConfirms();
    var confirmCard = '';
    if (oc.length || dc.length) {
      confirmCard = '<div class="card' + (oc.length ? ' warn' : '') + '">' +
        '<div class="between" style="margin-bottom:4px"><div class="h">' + (oc.length ? '需要您確認（' + oc.length + '）' : '待確認事項') + '</div>' + (oc.length ? '' : '<span class="chip teal">都已確認</span>') + '</div>' +
        oc.map(function (c) {
          var d = dueInfo(c);
          return '<div class="row"><div class="li" style="padding:0;font-weight:500">' + esc(c.title) + '</div>' +
            '<div class="muted" style="margin-top:2px">請在 ' + d.date + ' 前確認 · <b style="color:' + (d.left <= 7 ? 'var(--red-d)' : 'var(--amber-d)') + '">還剩 ' + d.left + ' 天</b></div>' +
            '<button class="btn sm teal" style="margin-top:8px" data-act="copen" data-arg="' + c.id + '">去確認</button></div>';
        }).join('') +
        (dc.length ? '<div class="muted" style="margin-top:' + (oc.length ? '10' : '4') + 'px">已確認 ' + dc.length + ' 項：' + dc.map(function (c) { return esc(c.title); }).join('、') + '</div>' : '') +
      '</div>';
    }
    return '<div class="body" style="font-size:14px">屋主您好，這是您家目前的施工進度。</div>' +
      confirmCard +
      '<div class="card">' +
        '<div style="display:flex;align-items:baseline;gap:8px"><span class="big">' + PCT + '%</span><span class="muted" style="font-size:13px">整體進度（依工期）</span></div>' +
        '<div class="bar lg" style="margin-top:10px"><i style="width:' + PCT + '%"></i></div>' +
        '<div class="between muted" style="margin-top:8px"><span>開工 114/08/20</span><span>預計完工 115/02/09</span></div>' +
      '</div>' +
      '<div class="card' + (top.today ? ' hl' : '') + '">' +
        '<div class="between" style="margin-bottom:8px"><div class="h">最新動態</div><span class="muted">' + (top.today ? '<span class="chip teal" style="margin-right:6px">今天</span>' : '') + top.date + '</span></div>' +
        top.entries.slice(0, 2).map(function (t) { return '<div class="li">· ' + esc(t) + '</div>'; }).join('') +
        (top.photos.length || more ? '<div class="muted" style="margin-top:6px">' + (top.photos.length ? top.photos.length + ' 張現場照片' + more : more.slice(1)) + '</div>' : '') +
        '<button class="btn sm line-teal" style="margin-top:10px" data-act="tab" data-arg="log">看工程日誌</button>' +
      '</div>' +
      (S.reportSent ? '<div class="card"><div class="h" style="margin-bottom:8px">本週工程匯報</div><div class="pre">' + esc(S.sentReport) + '</div></div>' : '') +
      planBrief();
  }

  // 首頁的「目前施工中／接下來」也只用屋主版大工種
  function planBrief() {
    var plan = planSorted(S.planPub);
    var doing = plan.filter(function (r) { return r.status === 'doing'; });
    var next = plan.filter(function (r) { return r.status === 'todo'; }).slice(0, 2);
    function item(r, color) { return '<div class="dotrow"><span class="dot" style="background:' + color + '"></span><div><div class="li" style="padding:0">' + esc(r.name) + '</div><div class="muted">' + planRange(r) + '</div></div></div>'; }
    return '<div class="card"><div class="h" style="margin-bottom:6px">目前施工中</div>' +
        (doing.length ? doing.map(function (r) { return item(r, 'var(--amber)'); }).join('') : '<div class="body">目前沒有施工中的工種</div>') +
      '</div>' +
      '<div class="card"><div class="h" style="margin-bottom:6px">接下來</div>' +
        next.map(function (r) { return item(r, 'var(--bar-todo)'); }).join('') +
        '<button class="btn sm line-teal" style="margin-top:8px" data-act="tab" data-arg="timeline">看完整工程時刻表</button>' +
      '</div>';
  }

  function cConfirm() {
    var c = findById(S.confirms, S.cConfirm);
    if (!c || c.status !== 'open') return cHome();
    var d = dueInfo(c);
    var ready = S.cPick !== null && S.cPick !== undefined;
    return '<button class="backlink" data-act="cclose">' + I.backSm + '返回首頁</button>' +
      '<div class="card warn">' +
        '<div class="h" style="font-size:17px">' + esc(c.title) + '</div>' +
        '<div class="muted" style="margin:4px 0 10px">請在 ' + d.text + ' · 還剩 ' + d.left + ' 天</div>' +
        (c.note ? '<div class="body" style="font-size:14px">' + esc(c.note) + '</div>' : '') +
      '</div>' +
      '<div class="lbl" id="optlbl">請選擇</div>' +
      '<div class="stack" role="group" aria-labelledby="optlbl">' + c.options.map(function (o, idx) {
        return '<button class="opt" data-act="cpick" data-arg="' + idx + '" aria-pressed="' + (S.cPick === idx) + '"><span class="radio"></span><span>' + esc(o) + '</span></button>';
      }).join('') + '</div>' +
      '<button class="btn teal" data-act="cdone" aria-disabled="' + !ready + '">確認送出</button>' +
      '<div class="muted">送出後設計師會收到通知，系統會留下確認時間。</div>';
  }

  // 屋主端「進度」：大工種工程時刻表（PIZZA 店格式），可切月曆／清單
  function cTimeline() {
    var plan = planSorted(S.planPub);
    var cnt = { done: 0, doing: 0, todo: 0 };
    plan.forEach(function (r) { cnt[r.status]++; });
    var legend = '<div class="legend"><span><i style="background:#D9A3A0"></i>好日子</span>' +
      Object.keys(PLAN_TYPES).map(function (k) { return '<span><i style="background:' + PLAN_TYPES[k].color + '"></i>' + PLAN_TYPES[k].label + '</span>'; }).join('') +
      '<span><i style="background:#D5DAE0"></i>週末</span></div>';
    var body;
    if (S.cPlanView === 'list') {
      body = '<div class="card" style="padding:6px 16px">' + plan.map(function (r) {
        return '<div class="tl" style="padding:12px 0"><div class="between" style="align-items:flex-start"><span class="name" style="font-size:14px">' + esc(r.name) + '</span><span class="chip ' + ST_CHIP[r.status] + '">' + PLAN_STATUS[r.status] + '</span></div>' +
          '<div class="range" style="font-size:12px;display:flex;align-items:center;gap:6px"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + PLAN_TYPES[r.type].color + '"></i>' + planRange(r) + '</div></div>';
      }).join('') + '</div>';
    } else {
      body = '<div class="mchips" role="group" aria-label="選擇月份">' + PLAN_MONTHS.map(function (m) {
          return '<button class="mchip" data-act="calm" data-arg="' + m + '" aria-pressed="' + (S.cMonth === m) + '">' + (+m.slice(5)) + ' 月</button>';
        }).join('') + '</div>' +
        legend + monthGrid(S.cMonth, plan) +
        '<div class="muted">左右滑動看整個月；橘框是今天</div>';
    }
    return '<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip lg teal">已完成 ' + cnt.done + '</span><span class="chip lg amber">施工中 ' + cnt.doing + '</span><span class="chip lg gray">未開始 ' + cnt.todo + '</span></div>' +
      '<div class="between"><div class="h" style="font-size:17px">工程時刻表</div><span class="muted">更新：' + esc(S.planPubAt) + '</span></div>' +
      '<div class="seg" role="group" aria-label="顯示方式"><button data-act="pview" data-arg="grid" aria-pressed="' + (S.cPlanView !== 'list') + '">月曆</button><button data-act="pview" data-arg="list" aria-pressed="' + (S.cPlanView === 'list') + '">清單</button></div>' +
      body;
  }

  function monthGrid(mk, plan) {
    var y = +mk.slice(0, 4), m = +mk.slice(5);
    var days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var cols = [];
    for (var d = 1; d <= days; d++) {
      var t = Date.UTC(y, m - 1, d);
      var dow = new Date(t).getUTCDay();
      cols.push({ d: d, t: t, dow: dow, we: dow === 0 || dow === 6, good: GOOD_DAYS.indexOf(isoOf(t)) >= 0, today: t === TODAY });
    }
    var head1 = '<tr><th class="nm" scope="col">' + m + ' 月</th>' + cols.map(function (c) { return '<th scope="col" class="' + (c.good ? 'good' : c.we ? 'we' : '') + (c.today ? ' today' : '') + '">' + c.d + '</th>'; }).join('') + '</tr>';
    var head2 = '<tr><th class="nm">星期</th>' + cols.map(function (c) { return '<th class="' + (c.we ? 'we' : '') + (c.today ? ' today' : '') + '">' + WK[c.dow] + '</th>'; }).join('') + '</tr>';
    var rows = plan.map(function (r) {
      var a = isoT(r.start), b = isoT(r.end);
      var dot = '<span style="display:inline-block;width:6px;height:6px;border-radius:3px;margin-right:4px;vertical-align:1px;background:' + (r.status === 'done' ? 'var(--teal)' : r.status === 'doing' ? 'var(--amber)' : 'var(--bar-todo)') + '"></span>';
      return '<tr><th class="nm" scope="row" title="' + esc(r.name) + '">' + dot + esc(r.name) + '</th>' + cols.map(function (c) {
        var on = c.t >= a && c.t <= b && !(c.we && (r.type === 'work' || r.type === 'measure'));
        return '<td class="' + (c.we ? 'we' : '') + (c.today ? ' today' : '') + '"' + (on ? ' style="background:' + PLAN_TYPES[r.type].color + '"' : '') + '></td>';
      }).join('') + '</tr>';
    }).join('');
    return '<div class="cal-wrap"><table class="cal"><thead>' + head1 + head2 + '</thead><tbody>' + rows + '</tbody></table></div>';
  }

  function cLog() {
    return '<div class="muted" style="font-size:13px">設計師每天整理的現場紀錄</div>' +
      feed().map(function (f) {
        return '<div class="card' + (f.today ? ' hl' : '') + '">' +
          '<div class="between"><div class="h">' + f.date + '</div>' + (f.today ? '<span class="chip teal">今天</span>' : '') + '</div>' +
          '<div class="muted" style="margin:2px 0 8px">' + esc(f.trades || '') + '</div>' +
          f.entries.map(function (t) { return '<div class="li">· ' + esc(t) + '</div>'; }).join('') +
          (f.photos.length ? '<div class="grid3" style="gap:6px;margin-top:10px">' + f.photos.map(function (p) { return photoSmall(p); }).join('') + '</div>' : '') +
        '</div>';
      }).join('');
  }

  function cAlbums() {
    var albums = groupAlbums(clientPhotos());
    var current = S.cAlbum ? albums.filter(function (a) { return a.trade === S.cAlbum; })[0] : null;
    if (current) return albumDetail(current, 'calbum', false);
    return '<div class="muted" style="font-size:13px">依工種整理的施工照片</div>' + albumList(albums, 'calbum', false);
  }

  function toastHtml(t) {
    if (!t) return '';
    return '<button class="toast' + (isFresh() ? ' fresh' : '') + '" data-act="' + (t.inApp ? 'dtoast' : 'toast') + '"><span class="ic' + (t.inApp ? ' in' : '') + '">' + I.bell + '</span><span class="tx"><span class="muted">' + (t.inApp ? '工程日誌 · 通知' : 'LINE · [工作室名稱]') + '</span><span style="font-size:14px;font-weight:500">' + esc(t.text) + '</span></span></button>';
  }

  function clientApp() {
    var body;
    if (S.cTab === 'home' && S.cConfirm) body = cConfirm();
    else body = S.cTab === 'timeline' ? cTimeline() : S.cTab === 'log' ? cLog() : S.cTab === 'albums' ? cAlbums() : cHome();
    var key = 'c-' + S.cTab + (S.cConfirm ? '-c' + S.cConfirm : '') + (S.cAlbum ? '-' + S.cAlbum : '');
    var tabs = [['home', '首頁', I.home], ['timeline', '進度', I.timeline], ['log', '日誌', I.log], ['albums', '相簿', I.album]].map(function (t) {
      return '<button class="tab" data-act="tab" data-arg="' + t[0] + '"' + (S.cTab === t[0] ? ' aria-current="page"' : '') + '>' + tabIcon(t[2]) + '<span>' + t[1] + '</span></button>';
    }).join('');
    return '<div class="screen">' +
      '<div class="appbar client"><div class="eyebrow">[工作室名稱] · 工程進度</div><div class="title">示範案場</div></div>' +
      '<div class="scroll" data-scroll="' + key + '">' + body + '</div>' +
      '<nav class="tabbar" aria-label="屋主端分頁">' + tabs + '</nav>' +
    '</div>' + toastHtml(S.toast);
  }

  function designerApp() {
    var m = { edit: dEdit, confirm: dConfirm, report: dReport, albums: dAlbums, issues: dIssues, convert: dConvert, sched: dSched, plan: dPlan };
    return (m[S.dScreen] || dHome)() + toastHtml(S.dToast);
  }

  // ---------- 畫面 ----------
  var app = document.getElementById('app');
  function render() {
    var scrolls = {};
    app.querySelectorAll('[data-scroll]').forEach(function (el) { scrolls[el.getAttribute('data-scroll')] = el.scrollTop; });
    var cBadge = S.clientNew && S.view !== 'client';
    var dBadge = S.designerNew && S.view !== 'designer';
    var snackOn = S.snack && S.view !== S.snack.to;
    app.innerHTML =
      '<header class="topbar"><div><h1>工程日誌 · 試用原型</h1><p>範例：示範案場 · 範例日期 114/10/30（四）</p></div>' +
        '<button class="reset" data-act="reset">重設示範</button></header>' +
      '<nav class="switch" aria-label="切換視角">' +
        '<button class="sw" data-act="view" data-arg="designer" aria-pressed="' + (S.view === 'designer') + '">設計師端' + (dBadge ? '<span class="new">新通知</span>' : '') + '</button>' +
        '<button class="sw" data-act="view" data-arg="client" aria-pressed="' + (S.view === 'client') + '">屋主端' + (cBadge ? '<span class="new">新通知</span>' : '') + '</button>' +
      '</nav>' +
      '<main class="stage" data-view="' + S.view + '">' +
        '<section class="col col-designer" aria-label="設計師端"><div class="col-label">' + I.lock + '<span>設計師端</span><span class="sub">內部 · 手機寫日誌</span></div><div class="device">' + designerApp() + '</div></section>' +
        '<section class="col col-client" aria-label="屋主端"><div class="col-label">' + I.eye + '<span>屋主端</span><span class="sub">從 LINE 點開的網頁 App</span></div><div class="device">' + clientApp() + '</div></section>' +
      '</main>' +
      '<div class="snack' + (snackOn ? ' show' : '') + (isFresh() ? ' fresh' : '') + '" role="status"><span class="grow">' + (S.snack ? esc(S.snack.text) : '') + '</span>' +
        (S.snack ? '<button data-act="view" data-arg="' + S.snack.to + '">' + (S.snack.to === 'client' ? '切到屋主端' : '切到設計師端') + '</button>' : '') + '</div>';
    app.querySelectorAll('[data-scroll]').forEach(function (el) { var k = el.getAttribute('data-scroll'); if (scrolls[k]) el.scrollTop = scrolls[k]; });
    // 月曆表打開時，橫向捲到今天附近
    app.querySelectorAll('.cal-wrap').forEach(function (w) {
      var td = w.querySelector('th.today');
      w.scrollLeft = td ? Math.max(0, td.offsetLeft - 140) : 0;
    });
    var snackKey = S.snack ? S.snack.text : null;
    if (snackKey !== shownSnack) {
      shownSnack = snackKey;
      clearTimeout(snackTimer);
      if (S.snack) snackTimer = setTimeout(function () { S.snack = null; render(); }, 4000);
    }
    // 設計師端的 App 內通知 6 秒後自動收起，避免擋住返回鍵
    var dKey = S.dToast ? S.dToast.text : null;
    if (dKey !== shownDToast) {
      shownDToast = dKey;
      clearTimeout(dToastTimer);
      if (S.dToast) dToastTimer = setTimeout(function () { S.dToast = null; save(); render(); }, 6000);
    }
  }

  // ---------- 操作 ----------
  function notifyClient(text, go, snackText) {
    markFresh();
    return { toast: { text: text, go: go }, clientNew: true, snack: { text: snackText, to: 'client' } };
  }
  var ACT = {
    go: function (arg) {
      var patch = { dScreen: arg, dToast: null };
      if (arg === 'albums') patch.dAlbum = null;
      set(patch);
    },
    tab: function (arg) { set({ cTab: arg, cConfirm: null, cAlbum: null, toast: null }); },
    view: function (arg) {
      var patch = { view: arg, snack: null };
      if (arg === 'client') patch.clientNew = false; else patch.designerNew = false;
      set(patch);
    },
    trade: function (arg) {
      var p = arg.split(':');
      set({ trades: S.trades.map(function (t) { return t.id === p[0] ? Object.assign({}, t, { n: Math.max(0, t.n + +p[1]) }) : t; }) });
    },
    entry: function (arg) { set({ entries: S.entries.map(function (e) { return String(e.id) === arg ? Object.assign({}, e, { pub: !e.pub }) : e; }) }); },
    photo: function (arg) { set({ photos: S.photos.map(function (p) { return String(p.id) === arg ? Object.assign({}, p, { pub: !p.pub }) : p; }) }); },
    add: function () {
      var input = document.getElementById('draft');
      var text = (input ? input.value : S.draft).trim();
      if (text) set({ draft: '', nextId: S.nextId + 1, entries: S.entries.concat([{ id: S.nextId, text: text, pub: false }]) });
      input = document.getElementById('draft');
      if (input) input.focus();
    },
    done: function () { set({ showDone: !S.showDone }); },
    notify: function () { set({ notify: !S.notify }); },
    publish: function () {
      var was = !!S.snapshot;
      var patch = { snapshot: currentPublic(), dScreen: 'home' };
      if (S.notify) Object.assign(patch, notifyClient('今日工程日誌已更新，點此查看', 'log', was ? '已更新，屋主收到 LINE 通知' : '已發布，屋主收到 LINE 通知'));
      else { markFresh(); patch.snack = { text: was ? '已更新發布' : '已發布', to: 'client' }; }
      set(patch);
    },
    unpublish: function () { set({ snapshot: null, toast: null, clientNew: false, snack: null }); },
    send: function () { set(Object.assign({ reportSent: true, sentReport: S.report, dScreen: 'home' }, notifyClient('本週工程匯報已送達，點此查看', 'home', '週報已發送給屋主'))); },
    toast: function () {
      var go = S.toast && S.toast.go || 'home';
      var patch = { toast: null, clientNew: false, cAlbum: null, cConfirm: null, cPick: null };
      if (go.indexOf('confirm:') === 0) { patch.cTab = 'home'; patch.cConfirm = go.split(':')[1]; } else patch.cTab = go;
      set(patch);
    },
    dtoast: function () { set({ dToast: null, designerNew: false, dScreen: 'home' }); },
    // 相簿
    dalbum: function (arg) { set({ dAlbum: arg || null }); },
    calbum: function (arg) { set({ cAlbum: arg || null }); },
    // 屋主待確認
    remind: function (arg) {
      var c = findById(S.confirms, arg);
      set(notifyClient('提醒：請在 ' + dueInfo(c).date + ' 前確認「' + c.title + '」', 'confirm:' + c.id, '已用 LINE 提醒屋主'));
    },
    copen: function (arg) { set({ cConfirm: arg, cPick: null }); },
    cclose: function () { set({ cConfirm: null, cPick: null }); },
    cpick: function (arg) { set({ cPick: +arg }); },
    cdone: function () {
      var c = findById(S.confirms, S.cConfirm);
      if (!c || S.cPick === null || S.cPick === undefined) return;
      var choice = c.options[S.cPick];
      markFresh();
      set({
        confirms: S.confirms.map(function (x) { return x.id === c.id ? Object.assign({}, x, { status: 'done', choice: choice, at: roc(TODAY) + ' ' + nowHM() }) : x; }),
        cConfirm: null, cPick: null,
        dToast: { text: '屋主已確認「' + c.title + '」：' + choice, inApp: true }, designerNew: true,
        snack: { text: '已送出，設計師收到通知', to: 'designer' }
      });
    },
    // 內部回報
    advance: function (arg) { set({ issues: S.issues.map(function (i) { return String(i.id) === arg ? Object.assign({}, i, { status: STATUS_NEXT[i.status] || i.status }) : i; }) }); },
    convert: function (arg) {
      var i = findById(S.issues, arg);
      var sug = i.suggest || { title: '', note: '' };
      set({ dScreen: 'convert', convertId: i.id, cvTitle: sug.title, cvNote: sug.note, cvDue: UPCOMING[0].name });
    },
    sendConvert: function () {
      var title = S.cvTitle.trim();
      if (!title) { var el = document.getElementById('cvTitle'); if (el) el.focus(); return; }
      var id = S.nextConfirm;
      var due = S.cvDue || UPCOMING[0].name;
      set(Object.assign({
        confirms: S.confirms.concat([{ id: id, title: title, note: S.cvNote.trim(), options: ['同意施作', '想先跟設計師討論'], due: due, status: 'open', choice: null, at: null }]),
        nextConfirm: id + 1,
        issues: S.issues.map(function (i) { return i.id === S.convertId ? Object.assign({}, i, { converted: true }) : i; }),
        dScreen: 'issues', convertId: null, cvTitle: '', cvNote: ''
      }, notifyClient('有一項新的事項需要您確認：' + title, 'confirm:' + id, '已送出給屋主確認')));
    },
    addIssue: function () {
      var input = document.getElementById('issueDraft');
      var title = (input ? input.value : S.issueDraft).trim();
      if (!title) { if (input) input.focus(); return; }
      set({ issues: [{ id: S.nextIssue, title: title, detail: '', level: S.issueLevel, status: '回報', at: '10/30', converted: false }].concat(S.issues), nextIssue: S.nextIssue + 1, issueDraft: '' });
    },
    // 屋主版工程時刻表
    calm: function (arg) { set({ cMonth: arg }); },
    pview: function (arg) { set({ cPlanView: arg }); },
    planAdd: function () { set({ plan: S.plan.concat([{ id: S.nextPlan, name: '新工種', type: 'work', start: '2026-01-05', end: '2026-01-09', status: 'todo' }]), nextPlan: S.nextPlan + 1 }); },
    planDel: function (arg) { set({ plan: S.plan.filter(function (r) { return String(r.id) !== arg; }) }); },
    planPub: function () {
      if (planInvalid() || !planDirty()) return;
      set(Object.assign({ planPub: JSON.parse(JSON.stringify(S.plan)), planPubAt: roc(TODAY) + ' ' + nowHM() }, notifyClient('工程時刻表已更新，點此查看', 'timeline', '已更新給屋主')));
    },
    reset: function () { S = initState(); save(); render(); }
  };
  function setPlanField(attr, value) {
    var p = attr.split(':');
    S.plan = S.plan.map(function (r) {
      if (String(r.id) !== p[0]) return r;
      var o = Object.assign({}, r); o[p[1]] = value; return o;
    });
    save();
  }

  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || !ACT[el.getAttribute('data-act')]) return;
    if (el.getAttribute('aria-disabled') === 'true' && el.getAttribute('data-act') !== 'sendConvert') return;
    ACT[el.getAttribute('data-act')](el.getAttribute('data-arg'));
  });
  app.addEventListener('input', function (ev) {
    var pf = ev.target.getAttribute('data-plan');
    if (pf && ev.target.tagName === 'INPUT' && ev.target.type === 'text') { setPlanField(pf, ev.target.value); return; }
    var k = ev.target.getAttribute('data-input');
    if (!k) return;
    S[k] = ev.target.value; save();
    if (k === 'cvTitle') { var b = document.getElementById('sendConvert'); if (b) b.setAttribute('aria-disabled', String(!ev.target.value.trim())); }
  });
  app.addEventListener('change', function (ev) {
    var t = ev.target;
    var pf = t.getAttribute('data-plan');
    if (pf) { setPlanField(pf, t.value); render(); return; }
    var pid = t.getAttribute('data-photo-trade');
    if (pid) { set({ photos: S.photos.map(function (p) { return String(p.id) === pid ? Object.assign({}, p, { trade: t.value }) : p; }) }); return; }
    var k = t.getAttribute('data-change');
    if (k) { S[k] = t.value; save(); }
  });
  // 表單送出：按按鈕或鍵盤 Enter／完成 都會觸發；中文輸入法選字時的 Enter 不會誤送
  app.addEventListener('submit', function (ev) {
    var f = ev.target.getAttribute('data-form');
    if (f === 'add') { ev.preventDefault(); ACT.add(); }
    if (f === 'issue') { ev.preventDefault(); ACT.addIssue(); }
  });

  render();
})();
</script>
</body>
</html>
